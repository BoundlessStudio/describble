name: Word not understood
description: Suggest a word or phrase Vignette should know.
labels: [lexicon]
body:
  - type: input
    id: word
    attributes:
      label: Word or phrase
      placeholder: backpack
    validations:
      required: true
  - type: textarea
    id: meaning
    attributes:
      label: What it should draw
      description: An existing piece (for example "the same as beanie") or something new.
    validations:
      required: true
